<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support Chat</title>
</head>

<body>

    <h1>AI Customer Support</h1>


    <!-- OLD CONVERSATION -->

    <h2>Conversation</h2>

    {% for message in messages %}

        {% if message["role"] == "user" %}

            <div>
                <strong>You:</strong>
                <p>{{ message["content"] }}</p>
            </div>

        {% else %}

            <div>
                <strong>AI Support:</strong>
                <p>{{ message["content"] }}</p>
            </div>

        {% endif %}

        <hr>

    {% endfor %}


    <!-- SEND NEW MESSAGE -->

    <form action="/chat/{{ conversation_id }}" method="POST">

        <label for="message">Your message:</label>

        <br>

        <textarea
            id="message"
            name="message"
            rows="5"
            cols="50"
            placeholder="How can we help you?"
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Send
        </button>

    </form>

</body>

</html>
